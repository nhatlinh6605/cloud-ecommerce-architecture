# KIẾN TRÚC CẢI TIẾN: LB01 + APP01/APP02 + DB01 + OBJ01 + MON01
name: improved
services:
  lb01:
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    networks: [frontend]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      app01: { condition: service_healthy }
      app02: { condition: service_healthy }
  app01:
    build: ./app
    environment: &appenv
      INSTANCE: app01
      DB_HOST: db01
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MINIO_HOST: obj01
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks: [frontend, backend, monitoring]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck: &apphc
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db01: { condition: service_healthy }
      obj01: { condition: service_started }
  app02:
    build: ./app
    environment: { <<: *appenv, INSTANCE: app02 }
    networks: [frontend, backend, monitoring]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck: *apphc
    depends_on:
      db01: { condition: service_healthy }
      obj01: { condition: service_started }
  db01:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "${DB_USER}", POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: "${DB_NAME}" }
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dbdata:/var/lib/postgresql/data
    networks: [backend]
    mem_limit: 512m
    cpus: "1.0"
    restart: unless-stopped
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ${DB_USER}"], interval: 5s, retries: 10 }
  obj01:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}" }
    volumes: [objdata:/data]
    networks: [backend]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes: ["./monitoring/prometheus.improved.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Hay dat GRAFANA_ADMIN_PASSWORD trong .env}
    ports: ["127.0.0.1:3001:3000"]
    networks: [monitoring]
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
networks:
  frontend: {}
  backend: { internal: true }
  monitoring: {}
volumes: { dbdata: {}, objdata: {} }