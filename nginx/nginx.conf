events {}
http {
  log_format lb '$remote_addr [$time_local] "$request" $status '
                'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log lb;

  upstream app_pool {
    server app01:3000 max_fails=2 fail_timeout=5s;
    server app02:3000 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app_pool;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
    }
  }
}