events {}
http {
  upstream app_pool {
    server app01:3000 max_fails=2 fail_timeout=5s;
    server app02:3000 max_fails=2 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://app_pool;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 1s;
    }
  }
}
